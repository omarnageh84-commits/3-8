<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمر ناجح - مطور مواقع</title>
    <style>
        :root { --bg-color: #f5f7fb; --card-color: white; --text-color: #111; --main-color: #0066ff; }
        body.dark { --bg-color: #0f1115; --card-color: #1a1d25; --text-color: #e8e8e8; --main-color: #3b82f6; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; text-align: center; transition: 0.3s; margin: 0; padding: 0; }
        header { background: linear-gradient(135deg, var(--main-color), #7c3aed); color: white; padding: 60px 20px; border-radius: 0 0 30px 30px; }
        header img { border-radius: 50%; border: 4px solid white; width: 150px; height: 150px; object-fit: cover; }
       .cards { display: flex; justify-content: center; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
       .card { background-color: var(--card-color); padding: 20px; border-radius: 15px; width: 120px; transition: 0.3s; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
       .card:hover { transform: translateY(-10px) scale(1.05); background-color: var(--main-color); color: white; }
        button { background-color: var(--main-color); color: white; padding: 12px 25px; border: none; border-radius: 25px; margin-top: 10px; transition: 0.3s; cursor: pointer; font-weight: bold; }
        button:hover { transform: scale(1.05); }
        section { margin: 40px 0; }
       .calculator,.todo-box,.contact-box { background-color: var(--card-color); padding: 25px; border-radius: 20px; margin: 20px auto; width: 380px; max-width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        input, textarea { padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; width: 90%; background-color: var(--bg-color); color: var(--text-color); }
        textarea { height: 80px; resize: none; }
       .op-btn { width: 65px; background-color: #222; }
       .todo-box ul { list-style: none; padding: 0; }
       .todo-box li { background-color: var(--bg-color); padding: 12px; margin: 8px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
       .task-text { cursor: pointer; flex: 1; text-align: right; word-break: break-word; }
       .project-tag { background-color: var(--main-color); color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; display: inline-block; margin-bottom: 10px; }
        @media (max-width: 600px) {.cards { flex-direction: column; align-items: center; }.card { width: 80%; } }
    </style>
</head>
<body>
    <header>
        <button onclick="toggleDark()" style="position: absolute; top: 15px; left: 15px; background-color: rgba(255,255,255,0.2);">🌙</button>
        <img src="https://via.placeholder.com/200" alt="صورتي">
        <h1 id="title">عمر ناجح</h1>
        <p>Front-End Developer</p>
        <br><button onclick="document.getElementById('contact').scrollIntoView({behavior: 'smooth'})">تواصل معايا</button>
    </header>
    <main>
        <section><h2>مهاراتي</h2><div class="cards"><div class="card">💻<br>HTML</div><div class="card">🎨<br>CSS</div><div class="card">⚡<br>JavaScript</div><div class="card">🔥<br>API</div></div></section>
        <section class="calculator"><span class="project-tag">مشروع 1</span><h2>آلة حاسبة</h2><input type="number" id="num1" placeholder="رقم 1"><input type="number" id="num2" placeholder="رقم 2"><br><button class="op-btn" onclick="calculate('+')">+</button><button class="op-btn" onclick="calculate('-')">-</button><button class="op-btn" onclick="calculate('*')">*</button><button class="op-btn" onclick="calculate('/')">/</button><h3 id="result">النتيجة: 0</h3></section>
        <section class="todo-box"><span class="project-tag">مشروع 2</span><h2>قايمة مهامي</h2><p id="taskCounter" style="font-size: 14px; color: gray;">عندك 0 مهام</p><input type="text" id="taskInput" placeholder="اكتب مهمة" style="width: 200px;"><button onclick="addTask()">اضافة</button><input type="text" id="searchInput" placeholder="🔍 ابحث..." style="width: 200px; margin-top: 10px;" onkeyup="filterTasks()"><ul id="taskList"></ul></section>
        <section class="todo-box"><span class="project-tag">مشروع 3</span><h2>سعر الدولار لايف</h2><h3 id="dollarPrice">بيحمل...</h3><button onclick="getDollarPrice()">حدث السعر</button></section>
        <section id="contact" class="contact-box"><span class="project-tag" style="background-color: #10b981;">تواصل</span><h2>ابعتلي رسالة</h2><input type="text" id="contactName" placeholder="اسمك"><input type="email" id="contactEmail" placeholder="ايميلك"><textarea id="contactMessage" placeholder="رسالتك..."></textarea><button onclick="sendMessage()" style="width: 95%; background-color: #10b981;">ابعت 🚀</button><p id="contactStatus"></p></section>
    </main>
    <footer style="background-color: var(--card-color); padding: 20px; margin-top: 40px;"><p>مصنوع بـ ❤️ بواسطة عمر - 2026</p></footer>
    <script>
        function calculate(op) { let n1 = Number(document.getElementById("num1").value); let n2 = Number(document.getElementById("num2").value); let r=0; if(op=='+') r=n1+n2; else if(op=='-') r=n1-n2; else if(op=='*') r=n1*n2; else if(op=='/') { if(n2==0){alert("مينفعش تقسم على صفر!"); return;} r=n1/n2;} document.getElementById("result").innerHTML="النتيجة: "+r; }
        window.onload = function() { let s=localStorage.getItem("myTasks"); if(s){document.getElementById("taskList").innerHTML=s; addDeleteEvents();} if(localStorage.getItem("darkMode")=="yes") document.body.classList.add("dark"); updateCounter(); getDollarPrice(); }
        function addTask() { let input=document.getElementById("taskInput"); let text=input.value; if(text==""){alert("اكتب حاجة!"); return;} let li=document.createElement("li"); li.innerHTML=`<span class="task-text" ondblclick="editTask(this)">${text}</span> <button onclick="deleteTask(this)" style="background:red; padding: 5px 10px; border-radius: 10px;">X</button>`; document.getElementById("taskList").appendChild(li); input.value=""; saveTasks(); updateCounter(); }
        function deleteTask(b){b.parentElement.remove(); saveTasks(); updateCounter();}
        function saveTasks(){localStorage.setItem("myTasks", document.getElementById("taskList").innerHTML);}
        function addDeleteEvents(){ document.querySelectorAll("#taskList button").forEach(btn=>btn.onclick=function(){deleteTask(this)}); document.querySelectorAll(".task-text").forEach(t=>t.ondblclick=function(){editTask(this)}); }
        async function getDollarPrice(){ document.getElementById("dollarPrice").innerHTML="بيحمل..."; try{ let res=await fetch("https://api.exchangerate-api.com/v4/latest/USD"); let data=await res.json(); document.getElementById("dollarPrice").innerHTML="1 دولار = "+data.rates.EGP+" جنيه"; }catch(e){document.getElementById("dollarPrice").innerHTML="النت فاصل";} }
        function toggleDark(){ document.body.classList.toggle("dark"); localStorage.setItem("darkMode", document.body.classList.contains("dark")?"yes":"no"); }
        function updateCounter(){ document.getElementById("taskCounter").innerHTML=`عندك ${document.getElementById("taskList").children.length} مهام`; }
        function editTask(span){ let n=prompt("عدل المهمة:", span.innerText); if(n && n!=""){span.innerText=n; saveTasks();} }
        function filterTasks(){ let f=document.getElementById("searchInput").value.toLowerCase(); let tasks=document.getElementById("taskList").getElementsByTagName("li"); for(let i=0;i<tasks.length;i++){ tasks[i].style.display=tasks[i].innerText.toLowerCase().includes(f)?"":"none"; } }
        function sendMessage(){ let name=document.getElementById("contactName").value; let email=document.getElementById("contactEmail").value; let msg=document.getElementById("contactMessage").value; let status=document.getElementById("contactStatus"); if(name==""||email==""||msg==""){status.innerHTML="❌ املى كل الخانات"; status.style.color="red"; return;} status.innerHTML="⏳ بيبعت..."; fetch(`https://formsubmit.co/ajax/${email}`,{method:"POST", headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:name, message:msg, _subject:`رسالة من ${name}`})}).then(r=>r.json()).then(d=>{status.innerHTML="✅ اتبعتت!"; status.style.color="green"; document.getElementById("contactName").value=""; document.getElementById("contactEmail").value=""; document.getElementById("contactMessage").value="";}).catch(e=>{status.innerHTML="❌ حصل مشكلة"; status.style.color="red";}); }
    </script>
</body>
</html>
